<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MagnitApp - Облік товарів</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="app">

  <div id="loginScreen">
    <h1>🔧 MagnitApp</h1>
    <form id="loginForm" class="card">
      <label>Логін</label>
      <input id="loginUsername" autocomplete="username" required>
      <label>Пароль</label>
      <input id="loginPassword" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn">Увійти</button>
    </form>
  </div>

  <div id="mainApp" class="hidden">
    <div class="topbar">
      <div id="meLabel" style="font-size:13px;color:#93a3b8;"></div>
      <div id="pushBanner" class="hidden" style="margin-top:6px;"></div>
    </div>
    <div id="view"></div>
  </div>

</div>

<nav class="bottomnav" id="bottomNav"></nav>

<script src="/app.js"></script>
</body>
</html>
